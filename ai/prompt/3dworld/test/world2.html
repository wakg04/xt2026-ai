<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>8x8小世界建造</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#1a1a1a;color:#fff;overflow:hidden;height:100vh}
#app{display:flex;flex-direction:column;height:100%}
#topbar{padding:10px;display:flex;gap:8px;align-items:center;background:#222;border-bottom:1px solid #444}
button{padding:6px 12px;border:none;border-radius:4px;background:#4488ff;color:#fff;cursor:pointer}
button:hover{background:#5599ff}
#tools{display:flex;gap:6px;margin-left:20px}
.tool{width:36px;height:36px;border:2px solid transparent;border-radius:4px;cursor:pointer;background:#333;display:grid;place-items:center;font-size:12px}
.tool.active{border-color:#4cf;background:#2a4a70}
#saveSwitch{margin-left:auto;display:flex;gap:6px}
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);padding:14px 24px;border-radius:8px;font-size:14px;opacity:1;transition:opacity 1.5s ease-out;pointer-events:none;z-index:99}
#canvasContainer{flex:1;position:relative}
canvas{width:100%;height:100%}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="tools">
      <div class="tool" data-type="grass">草地</div>
      <div class="tool" data-type="dirt">土路</div>
      <div class="tool" data-type="water">水</div>
      <div class="tool" data-type="stone">石头</div>
      <div class="tool" data-type="tree">树</div>
      <div class="tool" data-type="house">房子</div>
      <div class="tool" data-type="eraser">擦除</div>
    </div>
    <button id="resetBtn">随机村庄</button>
    <button id="clearBtn">清空</button>
    <div id="saveSwitch">
      <button class="saveBtn" data-save="0">存档1</button>
      <button class="saveBtn" data-save="1">存档2</button>
      <button class="saveBtn" data-save="2">存档3</button>
    </div>
  </div>
  <div id="canvasContainer">
    <canvas id="c"></canvas>
  </div>
</div>
<div id="hint">拖拽旋转视角 · 滚轮缩放 · 点击格子放置方块<br>3个存档自动保存，关闭网页下次还在</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script>
// 配置
const SIZE = 8;
const BLOCK_TYPES = {
  grass: {color:"#5a9",height:0},
  dirt: {color:"#b97",height:0},
  water: {color:"#48b",height:-0.1},
  stone:{color:"#888",height:0},
  tree: {color:"#384",height:1.2},
  house:{color:"#a75",height:1},
  eraser:{color:null,height:0}
};
let currentTool = "grass";
let currentSave = 0;
let worlds = [[],[],[]];

// 加载存档
function loadAll(){
  const s = localStorage.getItem("tinyWorlds");
  if(s) worlds = JSON.parse(s);
  for(let i=0;i<3;i++){
    if(worlds[i].length===0) worlds[i] = Array(SIZE*SIZE).fill("grass");
  }
  loadWorld(currentSave);
}
function saveAll(){
  localStorage.setItem("tinyWorlds",JSON.stringify(worlds));
}
function loadWorld(idx){
  currentSave = idx;
  renderGrid();
}

// THREE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22262a);
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(6,8,10);
const renderer = new THREE.WebGLRenderer({canvas:c,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.4));

// 网格&交互
let gridMesh = null;
let hoverMesh = null;
let hoverPos = null;
let theta=0.6,phi=1.2,zoom=12;
let isDrag=false,lastX=0,lastY=0;

// 方块几何体
const geoGround = new THREE.BoxGeometry(0.96,0.1,0.96);
const geoTree = new THREE.CylinderGeometry(0.2,0.2,1.2,8);
const geoHouse = new THREE.BoxGeometry(0.8,1,0.8);
const geoStone = new THREE.BoxGeometry(0.9,0.9,0.9);

function posToIdx(x,z){return x+z*SIZE}
function idxToPos(i){return {x:i%SIZE,z:Math.floor(i/SIZE)}}

// 渲染整个8x8
function renderGrid(){
  if(gridMesh) scene.remove(gridMesh);
  gridMesh = new THREE.Group();
  const w = worlds[currentSave];
  for(let z=0;z<SIZE;z++){
    for(let x=0;x<SIZE;x++){
      const t = w[posToIdx(x,z)];
      const cfg = BLOCK_TYPES[t];
      if(t==="eraser"||!cfg.color)continue;
      let mesh;
      if(t==="tree"){
        mesh = new THREE.Mesh(geoTree,new THREE.MeshLambertMaterial({color:cfg.color}));
      }else if(t==="house"){
        mesh = new THREE.Mesh(geoHouse,new THREE.MeshLambertMaterial({color:cfg.color}));
      }else if(t==="stone"){
        mesh = new THREE.Mesh(geoStone,new THREE.MeshLambertMaterial({color:cfg.color}));
      }else{
        mesh = new THREE.Mesh(geoGround,new THREE.MeshLambertMaterial({color:cfg.color}));
      }
      mesh.position.set(x,cfg.height,z);
      gridMesh.add(mesh);
    }
  }
  scene.add(gridMesh);
  createHover();
}
function createHover(){
  if(hoverMesh)scene.remove(hoverMesh);
  hoverMesh = new THREE.Mesh(geoGround,new THREE.MeshBasicMaterial({color:"#fff",transparent:true,opacity:0.3}));
  scene.add(hoverMesh);
}

// 射线拾取
const raycaster = new THREE.Raycaster();
function getGridPos(e){
  const rect = c.getBoundingClientRect();
  const x = (e.clientX-rect.left)/rect.width*2-1;
  const y = -(e.clientY-rect.top)/rect.height*2+1;
  raycaster.setFromCamera(new THREE.Vector2(x,y),camera);
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const pt = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane,pt);
  const gx = Math.round(pt.x);
  const gz = Math.round(pt.z);
  if(gx>=0&&gx<SIZE&&gz>=0&&gz<SIZE) return {x:gx,z:gz};
  return null;
}

// 鼠标事件
c.addEventListener("mousemove",e=>{
  if(isDrag){
    theta+=(e.clientX-lastX)*0.01;
    phi=Math.max(0.3,Math.min(1.4,phi+(e.clientY-lastY)*0.01));
    lastX=e.clientX;lastY=e.clientY;
    return;
  }
  const p = getGridPos(e);
  hoverPos = p;
  if(p){
    hoverMesh.visible=true;
    hoverMesh.position.set(p.x,0,p.z);
  }else hoverMesh.visible=false;
});
c.addEventListener("mousedown",e=>{
  if(e.button===0){
    const p = getGridPos(e);
    if(p){
      const idx = posToIdx(p.x,p.z);
      worlds[currentSave][idx] = currentTool==="eraser"?"grass":currentTool;
      renderGrid();saveAll();
    }
    isDrag=true;lastX=e.clientX;lastY=e.clientY;
  }
});
c.addEventListener("mouseup",()=>isDrag=false);
c.addEventListener("wheel",e=>{
  zoom=Math.max(4,Math.min(20,zoom+e.deltaY*0.01));
});

// 随机生成小村庄
function genVillage(){
  const w = Array(SIZE*SIZE).fill("grass");
  // 水塘
  const cx=Math.floor(SIZE/2),cz=Math.floor(SIZE/2);
  for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
    const x=cx+dx,z=cz+dz;
    if(x>=0&&x<SIZE&&z>=0&&z<SIZE)w[posToIdx(x,z)]="water";
  }
  // 石堆
  for(let i=0;i<4;i++){
    const x=Math.floor(Math.random()*SIZE);
    const z=Math.floor(Math.random()*SIZE);
    w[posToIdx(x,z)]="stone";
  }
  // 小路土路连通
  for(let i=0;i<SIZE;i++)w[posToIdx(i,Math.floor(SIZE/2))]="dirt";
  for(let i=0;i<SIZE;i++)w[posToIdx(Math.floor(SIZE/2),i)]="dirt";
  // 房子
  for(let i=0;i<3;i++){
    const x=Math.floor(Math.random()*SIZE);
    const z=Math.floor(Math.random()*SIZE);
    w[posToIdx(x,z)]="house";
  }
  // 树
  for(let i=0;i<6;i++){
    const x=Math.floor(Math.random()*SIZE);
    const z=Math.floor(Math.random()*SIZE);
    w[posToIdx(x,z)]="tree";
  }
  worlds[currentSave]=w;
  renderGrid();saveAll();
}
// 清空为草地
function clearAll(){
  worlds[currentSave]=Array(SIZE*SIZE).fill("grass");
  renderGrid();saveAll();
}

// UI绑定
document.querySelectorAll(".tool").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll(".tool").forEach(t=>t.classList.remove("active"));
    el.classList.add("active");
    currentTool=el.dataset.type;
  }
});
document.querySelector(".tool[data-type='grass']").classList.add("active");
document.getElementById("resetBtn").onclick=genVillage;
document.getElementById("clearBtn").onclick=clearAll;
document.querySelectorAll(".saveBtn").forEach(b=>{
  b.onclick=()=>loadWorld(+b.dataset.save);
});

// 视角更新循环
function animate(){
  const r = zoom*Math.sin(phi);
  camera.position.set(Math.cos(theta)*r,zoom*Math.cos(phi),Math.sin(theta)*r);
  camera.lookAt(SIZE/2-0.5,0,SIZE/2-0.5);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// 提示自动消失
setTimeout(()=>{
  document.getElementById("hint").style.opacity=0;
},3000);

loadAll();
animate();
</script>
</body>
</html>
