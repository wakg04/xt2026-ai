<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌上的小世界 · 编辑器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        :root {
            --glass: rgba(255, 248, 240, 0.85);
            --border: rgba(255, 240, 220, 0.6);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            overflow: hidden;
            background: #f5e8d3;
            color: #3c2f2f;
            height: 100vh;
            user-select: none;
        }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .panel {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        
        #top-panel {
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }
        
        #title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        select, button {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }
        
        button:hover {
            background: #fff8e8;
            transform: translateY(-1px);
        }
        
        #tools {
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 12px;
            z-index: 100;
        }
        
        .tool {
            width: 68px;
            height: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: white;
            border: 2px solid transparent;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            font-weight: 500;
        }
        
        .tool:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .tool.active {
            border-color: #ff8a65;
            background: #fff0e0;
            box-shadow: 0 0 0 3px rgba(255, 138, 101, 0.3);
        }
        
        .tool .emoji {
            font-size: 28px;
        }
        
        #minimap {
            right: 24px;
            bottom: 24px;
            width: 160px;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }
        
        #tooltip {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(60, 47, 47, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 200;
        }
        
        .save-slot {
            padding: 6px 12px;
            margin: 4px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .save-slot:hover { background: #fff0e0; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="panel" id="top-panel">
        <div id="title">桌上的小世界</div>
        <select id="save-select">
            <option value="0">世界 1</option>
            <option value="1">世界 2</option>
            <option value="2">世界 3</option>
        </select>
        <button id="reset-btn">🌱 随机村庄</button>
        <button id="clear-btn">🧹 清空</button>
    </div>
    
    <div class="panel" id="tools">
        <div class="tool active" data-tool="grass"><div class="emoji">🌿</div><div>草地</div></div>
        <div class="tool" data-tool="dirt"><div class="emoji">🟫</div><div>土路</div></div>
        <div class="tool" data-tool="water"><div class="emoji">💧</div><div>水</div></div>
        <div class="tool" data-tool="stone"><div class="emoji">🪨</div><div>石头</div></div>
        <div class="tool" data-tool="tree"><div class="emoji">🌳</div><div>树</div></div>
        <div class="tool" data-tool="house"><div class="emoji">🏠</div><div>房子</div></div>
        <div class="tool" data-tool="erase"><div class="emoji">🧼</div><div>擦除</div></div>
    </div>
    
    <canvas id="minimap" width="160" height="160"></canvas>
    
    <div id="tooltip">拖拽旋转视角 • 滚轮缩放 • 点击放置物品</div>
    
    <script>
        // ====================== IIFE 主程序 ======================
        (function () {
            // ==================== 配置 ====================
            const SIZE = 8;
            const CELL_SIZE = 2;
            const HEIGHT_SCALE = 0.6;
            
            // ==================== 状态 ====================
            let scene, camera, renderer, raycaster, mouse;
            let world = []; // world[x][z] = { terrain: 'grass'|'dirt'|'water', kind: 'none'|'tree'|'house'|'stone' }
            let objects = new Map(); // key: `${x},${z}` => THREE.Group
            let currentTool = 'grass';
            let currentSave = 0;
            let saves = [{}, {}, {}]; // 持久化数据
            let isDragging = false;
            let previousMouse = { x: 0, y: 0 };
            let hoveredCell = null;
            
            // ==================== 工具定义 ====================
            const tools = {
                grass: { emoji: '🌿', color: 0x6bb24a, height: 0.1 },
                dirt: { emoji: '🟫', color: 0xc9a66b, height: 0.2 },
                water: { emoji: '💧', color: 0x4a9eff, height: 0.05 },
                stone: { emoji: '🪨', color: 0x777777, height: 0.4 },
                tree: { emoji: '🌳', color: null, height: 0 },
                house: { emoji: '🏠', color: null, height: 0 },
                erase: { emoji: '🧼', color: null, height: 0 }
            };
            
            // ==================== 初始化 Three.js ====================
            function initThree() {
                const canvas = document.getElementById('canvas');
                renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas, 
                    antialias: true,
                    alpha: false 
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf5e8d3);
                
                // 相机（斜45度俯视桌感）
                camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(12, 18, 12);
                camera.lookAt(SIZE * CELL_SIZE / 2, 0, SIZE * CELL_SIZE / 2);
                
                // 光照（自然日光感）
                const hemi = new THREE.HemisphereLight(0xfff8e1, 0x9ab8a0, 0.75);
                scene.add(hemi);
                
                const dirLight = new THREE.DirectionalLight(0xfff0d0, 1.1);
                dirLight.position.set(15, 25, 10);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 1024;
                dirLight.shadow.mapSize.height = 1024;
                dirLight.shadow.camera.near = 1;
                dirLight.shadow.camera.far = 60;
                dirLight.shadow.camera.left = -20;
                dirLight.shadow.camera.right = 20;
                dirLight.shadow.camera.top = 20;
                dirLight.shadow.camera.bottom = -20;
                dirLight.shadow.radius = 3; // 柔和阴影
                scene.add(dirLight);
                
                // 环境光补充
                scene.add(new THREE.AmbientLight(0xe8d9c0, 0.6));
                
                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();
            }
            
            // ==================== 世界数据 ====================
            function createEmptyWorld() {
                world = Array(SIZE).fill().map(() => Array(SIZE).fill().map(() => ({
                    terrain: 'grass',
                    kind: 'none'
                })));
            }
            
            function setCell(x, z, terrain = null, kind = null) {
                if (x < 0 || x >= SIZE || z < 0 || z >= SIZE) return;
                const cell = world[x][z];
                if (terrain !== null) cell.terrain = terrain;
                if (kind !== null) cell.kind = kind;
                
                rebuildCell(x, z);
                renderMinimap();
            }
            
            // ==================== 3D 对象工厂 ====================
            function createTerrainMesh(terrain) {
                const geo = new THREE.BoxGeometry(CELL_SIZE, 0.6, CELL_SIZE);
                const mat = new THREE.MeshLambertMaterial({ 
                    color: tools[terrain].color 
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }
            
            function createTree() {
                const group = new THREE.Group();
                
                // 树干
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.25, 0.35, 1.8, 8),
                    new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
                );
                trunk.position.y = 0.9;
                trunk.castShadow = true;
                group.add(trunk);
                
                // 树叶
                const leaves = new THREE.Mesh(
                    new THREE.ConeGeometry(1.2, 2.2, 6),
                    new THREE.MeshLambertMaterial({ color: 0x2e8b2e })
                );
                leaves.position.y = 2.4;
                leaves.castShadow = true;
                group.add(leaves);
                
                const leaves2 = leaves.clone();
                leaves2.scale.set(0.8, 0.7, 0.8);
                leaves2.position.y = 3.1;
                group.add(leaves2);
                
                return group;
            }
            
            function createHouse() {
                const group = new THREE.Group();
                
                // 主体
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 1.6, 2.2),
                    new THREE.MeshLambertMaterial({ color: 0xe6b88a })
                );
                body.position.y = 0.8;
                body.castShadow = true;
                group.add(body);
                
                // 屋顶
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(1.6, 1.2, 4),
                    new THREE.MeshLambertMaterial({ color: 0xc44a4a })
                );
                roof.rotation.y = Math.PI / 4;
                roof.position.y = 2.3;
                roof.castShadow = true;
                group.add(roof);
                
                return group;
            }
            
            function createStone() {
                const stone = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(0.7, 1),
                    new THREE.MeshLambertMaterial({ color: 0x888888 })
                );
                stone.position.y = 0.4;
                stone.castShadow = true;
                stone.receiveShadow = true;
                return stone;
            }
            
            function rebuildCell(x, z) {
                const key = `${x},${z}`;
                // 移除旧对象
                if (objects.has(key)) {
                    scene.remove(objects.get(key));
                    objects.delete(key);
                }
                
                const cell = world[x][z];
                const group = new THREE.Group();
                group.userData = { x, z };
                
                // 地形
                const terrainMesh = createTerrainMesh(cell.terrain);
                terrainMesh.position.set(
                    x * CELL_SIZE + CELL_SIZE/2,
                    tools[cell.terrain].height / 2,
                    z * CELL_SIZE + CELL_SIZE/2
                );
                group.add(terrainMesh);
                
                // 装饰
                if (cell.kind === 'tree') {
                    const tree = createTree();
                    tree.position.set(
                        x * CELL_SIZE + CELL_SIZE/2,
                        0,
                        z * CELL_SIZE + CELL_SIZE/2
                    );
                    group.add(tree);
                } else if (cell.kind === 'house') {
                    const house = createHouse();
                    house.position.set(
                        x * CELL_SIZE + CELL_SIZE/2,
                        0,
                        z * CELL_SIZE + CELL_SIZE/2
                    );
                    group.add(house);
                } else if (cell.kind === 'stone') {
                    const stone = createStone();
                    stone.position.set(
                        x * CELL_SIZE + CELL_SIZE/2,
                        0,
                        z * CELL_SIZE + CELL_SIZE/2
                    );
                    group.add(stone);
                }
                
                scene.add(group);
                objects.set(key, group);
            }
            
            function rebuildAll() {
                objects.forEach(obj => scene.remove(obj));
                objects.clear();
                for (let x = 0; x < SIZE; x++) {
                    for (let z = 0; z < SIZE; z++) {
                        rebuildCell(x, z);
                    }
                }
            }
            
            // ==================== 随机村庄生成 ====================
            function generateRandomVillage() {
                createEmptyWorld();
                
                // 水塘
                const pondX = Math.floor(SIZE/2) - 1;
                const pondZ = 3;
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        if (Math.abs(dx) + Math.abs(dz) < 3) {
                            setCell(pondX + dx, pondZ + dz, 'water');
                        }
                    }
                }
                
                // 石堆
                for (let i = 0; i < 5; i++) {
                    const sx = Math.floor(Math.random() * (SIZE - 2)) + 1;
                    const sz = Math.floor(Math.random() * (SIZE - 2)) + 1;
                    setCell(sx, sz, 'stone', 'stone');
                }
                
                // 树木
                for (let i = 0; i < 7; i++) {
                    const tx = Math.floor(Math.random() * SIZE);
                    const tz = Math.floor(Math.random() * SIZE);
                    if (world[tx][tz].terrain !== 'water') {
                        setCell(tx, tz, null, 'tree');
                    }
                }
                
                // 房子
                for (let i = 0; i < 4; i++) {
                    const hx = Math.floor(Math.random() * (SIZE - 3)) + 1;
                    const hz = Math.floor(Math.random() * (SIZE - 3)) + 1;
                    if (world[hx][hz].terrain !== 'water') {
                        setCell(hx, hz, 'dirt', 'house');
                    }
                }
                
                // 小路
                for (let i = 1; i < SIZE - 1; i++) {
                    setCell(i, 5, 'dirt');
                }
                for (let i = 2; i < 6; i++) {
                    setCell(3, i, 'dirt');
                }
                
                rebuildAll();
                renderMinimap();
            }
            
            // ==================== 小地图 ====================
            let miniCtx;
            function initMinimap() {
                const mini = document.getElementById('minimap');
                miniCtx = mini.getContext('2d');
            }
            
            function renderMinimap() {
                if (!miniCtx) return;
                const s = 160;
                const cs = s / SIZE;
                
                miniCtx.fillStyle = '#d4c3a8';
                miniCtx.fillRect(0, 0, s, s);
                
                for (let x = 0; x < SIZE; x++) {
                    for (let z = 0; z < SIZE; z++) {
                        const cell = world[x][z];
                        let color = '#6bb24a';
                        
                        if (cell.terrain === 'dirt') color = '#c9a66b';
                        else if (cell.terrain === 'water') color = '#4a9eff';
                        else if (cell.terrain === 'stone') color = '#777';
                        
                        miniCtx.fillStyle = color;
                        miniCtx.fillRect(x * cs, z * cs, cs, cs);
                        
                        // 装饰剪影
                        if (cell.kind === 'tree') {
                            miniCtx.fillStyle = '#1e5f1e';
                            miniCtx.fillRect(x * cs + cs * 0.3, z * cs + cs * 0.2, cs * 0.4, cs * 0.6);
                        } else if (cell.kind === 'house') {
                            miniCtx.fillStyle = '#8b3e3e';
                            miniCtx.fillRect(x * cs + cs * 0.2, z * cs + cs * 0.3, cs * 0.6, cs * 0.5);
                        }
                    }
                }
                
                // 当前选中高亮
                if (hoveredCell) {
                    miniCtx.strokeStyle = '#ff8a65';
                    miniCtx.lineWidth = 3;
                    miniCtx.strokeRect(
                        hoveredCell.x * cs + 2, 
                        hoveredCell.z * cs + 2, 
                        cs - 4, 
                        cs - 4
                    );
                }
            }
            
            // ==================== 交互 ====================
            function getCellFromMouse(e) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                
                for (let inter of intersects) {
                    let obj = inter.object;
                    while (obj && !obj.userData.x) obj = obj.parent;
                    if (obj && obj.userData.x !== undefined) {
                        return { x: obj.userData.x, z: obj.userData.z };
                    }
                }
                return null;
            }
            
            function onMouseDown(e) {
                if (e.button === 0) { // 左键放置
                    const cell = getCellFromMouse(e);
                    if (cell) {
                        if (currentTool === 'erase') {
                            setCell(cell.x, cell.z, 'grass', 'none');
                        } else if (['tree','house','stone'].includes(currentTool)) {
                            setCell(cell.x, cell.z, null, currentTool);
                        } else {
                            setCell(cell.x, cell.z, currentTool, 'none');
                        }
                    }
                } else if (e.button === 2) { // 右键拖拽开始
                    isDragging = true;
                    previousMouse = { x: e.clientX, y: e.clientY };
                }
            }
            
            function onMouseMove(e) {
                const cell = getCellFromMouse(e);
                if (cell && (hoveredCell === null || hoveredCell.x !== cell.x || hoveredCell.z !== cell.z)) {
                    hoveredCell = cell;
                    renderMinimap();
                } else if (!cell) {
                    hoveredCell = null;
                    renderMinimap();
                }
                
                if (isDragging) {
                    const dx = (e.clientX - previousMouse.x) * 0.008;
                    const dy = (e.clientY - previousMouse.y) * 0.008;
                    
                    const radius = camera.position.length();
                    const theta = Math.atan2(camera.position.x, camera.position.z);
                    const phi = Math.acos(camera.position.y / radius);
                    
                    const newTheta = theta - dx;
                    let newPhi = phi + dy;
                    newPhi = Math.max(0.2, Math.min(1.4, newPhi));
                    
                    camera.position.x = radius * Math.sin(newPhi) * Math.sin(newTheta);
                    camera.position.z = radius * Math.sin(newPhi) * Math.cos(newTheta);
                    camera.position.y = radius * Math.cos(newPhi);
                    
                    camera.lookAt(SIZE * CELL_SIZE / 2, 1, SIZE * CELL_SIZE / 2);
                    previousMouse = { x: e.clientX, y: e.clientY };
                }
            }
            
            function onMouseUp() {
                isDragging = false;
            }
            
            function onWheel(e) {
                const factor = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(factor);
                camera.lookAt(SIZE * CELL_SIZE / 2, 1, SIZE * CELL_SIZE / 2);
            }
            
            // ==================== 持久化 ====================
            function loadSaves() {
                const saved = localStorage.getItem('tinyWorldSaves');
                if (saved) {
                    saves = JSON.parse(saved);
                }
            }
            
            function saveCurrent() {
                saves[currentSave] = JSON.parse(JSON.stringify(world));
                localStorage.setItem('tinyWorldSaves', JSON.stringify(saves));
            }
            
            function loadWorld(idx) {
                currentSave = idx;
                if (saves[idx] && Object.keys(saves[idx]).length > 0) {
                    world = JSON.parse(JSON.stringify(saves[idx]));
                } else {
                    createEmptyWorld();
                }
                rebuildAll();
                renderMinimap();
            }
            
            // ==================== UI 事件 ====================
            function setupUI() {
                // 工具选择
                document.querySelectorAll('.tool').forEach(tool => {
                    tool.addEventListener('click', () => {
                        document.querySelectorAll('.tool').forEach(t => t.classList.remove('active'));
                        tool.classList.add('active');
                        currentTool = tool.dataset.tool;
                    });
                });
                
                // 存档切换
                const select = document.getElementById('save-select');
                select.addEventListener('change', () => {
                    saveCurrent();
                    loadWorld(parseInt(select.value));
                });
                
                // 重置村庄
                document.getElementById('reset-btn').addEventListener('click', () => {
                    if (confirm('生成一个新的随机小村庄？当前世界将会被覆盖。')) {
                        generateRandomVillage();
                        saveCurrent();
                    }
                });
                
                // 清空
                document.getElementById('clear-btn').addEventListener('click', () => {
                    if (confirm('确定要清空当前世界吗？')) {
                        createEmptyWorld();
                        rebuildAll();
                        renderMinimap();
                        saveCurrent();
                    }
                });
                
                // 提示淡出
                setTimeout(() => {
                    document.getElementById('tooltip').style.opacity = '0';
                }, 4500);
            }
            
            // ==================== 动画循环 ====================
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            
            // ==================== 窗口大小 ====================
            function onResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            
            // ==================== 启动 ====================
            function start() {
                initThree();
                initMinimap();
                loadSaves();
                createEmptyWorld();
                rebuildAll();
                renderMinimap();
                
                setupUI();
                
                // 事件绑定
                window.addEventListener('resize', onResize);
                const canvas = document.getElementById('canvas');
                canvas.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('wheel', onWheel, { passive: true });
                canvas.addEventListener('contextmenu', e => e.preventDefault());
                
                // 自动保存（每8秒）
                setInterval(() => {
                    saveCurrent();
                }, 8000);
                
                // 初始加载第一个世界
                loadWorld(0);
                
                animate();
            }
            
            // 启动！
            window.onload = start;
        })();
    </script>
</body>
</html>
