<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你世界 - 3D建造游戏</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden;
            background: #1a1a2e;
            color: white;
        }

        /* 主场景容器 */
        #scene-container {
            width: 100vw;
            height: 80vh;
            position: relative;
        }

        /* 底部模型选择栏 */
        #model-selector {
            height: 20vh;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            border-top: 2px solid #0f3460;
        }

        .model-item {
            width: 70px;
            height: 70px;
            background: #0f3460;
            border: 2px solid transparent;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-item:hover {
            background: #1f538d;
            transform: translateY(-3px);
        }

        .model-item.active {
            border-color: #e94560;
            background: #1f538d;
        }

        .model-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .model-name {
            font-size: 12px;
            text-align: center;
        }

        /* 俯瞰图 */
        #minimap {
            position: absolute;
            bottom: 22vh;
            right: 20px;
            width: 180px;
            height: 180px;
            background: rgba(22, 33, 62, 0.9);
            border: 2px solid #0f3460;
            border-radius: 10px;
            overflow: hidden;
        }

        /* 信息面板 */
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid #0f3460;
            border-radius: 10px;
            padding: 15px;
            display: none;
        }

        .info-title {
            font-size: 18px;
            color: #e94560;
            margin-bottom: 10px;
        }

        .info-detail {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        /* 编辑控制栏 */
        #edit-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid #0f3460;
            border-radius: 10px;
            padding: 10px;
            display: none;
        }

        .control-group {
            margin: 8px 0;
        }

        .control-btn {
            background: #0f3460;
            border: none;
            color: white;
            padding: 6px 10px;
            margin: 0 3px;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-btn:hover {
            background: #1f538d;
        }
    </style>
</head>
<body>
    <!-- 主3D场景 -->
    <div id="scene-container"></div>

    <!-- 模型选择栏 -->
    <div id="model-selector">
        <div class="model-item active" data-type="land">
            <div class="model-icon">🟤</div>
            <div class="model-name">土地</div>
        </div>
        <div class="model-item" data-type="house">
            <div class="model-icon">🏠</div>
            <div class="model-name">房子</div>
        </div>
        <div class="model-item" data-type="path">
            <div class="model-icon">🟫</div>
            <div class="model-name">小径</div>
        </div>
        <div class="model-item" data-type="tree">
            <div class="model-icon">🌳</div>
            <div class="model-name">树木</div>
        </div>
        <div class="model-item" data-type="water">
            <div class="model-icon">🔵</div>
            <div class="model-name">水面</div>
        </div>
    </div>

    <!-- 俯瞰图 -->
    <canvas id="minimap"></canvas>

    <!-- 信息面板 -->
    <div id="info-panel">
        <button class="close-btn" onclick="closeInfo()">×</button>
        <div class="info-title" id="info-name">模型信息</div>
        <div class="info-detail" id="info-type">类型：</div>
        <div class="info-detail" id="info-pos">位置：</div>
        <div class="info-detail" id="info-scale">缩放：</div>
        <div class="info-detail" id="info-rotate">旋转：</div>
    </div>

    <!-- 编辑控制栏 -->
    <div id="edit-controls">
        <div class="control-group">
            <span>旋转：</span>
            <button class="control-btn" onclick="rotateModel(90)">+90°</button>
            <button class="control-btn" onclick="rotateModel(-90)">-90°</button>
        </div>
        <div class="control-group">
            <span>缩放：</span>
            <button class="control-btn" onclick="scaleModel(1.2)">放大</button>
            <button class="control-btn" onclick="scaleModel(0.8)">缩小</button>
        </div>
    </div>

    <script>
        // 基础配置
        const GRID_SIZE = 10;
        const CELL_SIZE = 1;
        let currentModelType = 'land';
        let selectedObject = null;
        let gridObjects = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));

        // 场景、相机、渲染器
        let scene, camera, renderer, controls, minimapCtx;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // 模型材质定义
        const materials = {
            land: new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
            house: new THREE.MeshLambertMaterial({ color: 0xFF6347 }),
            path: new THREE.MeshLambertMaterial({ color: 0xA0522D }),
            tree: new THREE.MeshLambertMaterial({ color: 0x228B22 }),
            water: new THREE.MeshLambertMaterial({ color: 0x4682B4, transparent: true, opacity: 0.8 })
        };

        // 初始化游戏
        init();
        animate();

        function init() {
            // 创建主场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight * 0.8), 0.1, 1000);
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);

            // 渲染器
            const container = document.getElementById('scene-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight * 0.8);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 轨道控制
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 光照
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 创建网格地面
            createGrid();
            
            // 初始化俯瞰图
            initMinimap();
            
            // 绑定事件
            bindEvents();
        }

        // 创建10*10网格
        function createGrid() {
            const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0xaaaaaa, 0x555555);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }

        // 初始化俯瞰图
        function initMinimap() {
            const canvas = document.getElementById('minimap');
            minimapCtx = canvas.getContext('2d');
            canvas.width = 180;
            canvas.height = 180;
            drawMinimap();
        }

        // 绘制俯瞰图
        function drawMinimap() {
            const size = 180;
            const cellSize = size / GRID_SIZE;
            minimapCtx.clearRect(0, 0, size, size);
            
            // 绘制网格
            minimapCtx.strokeStyle = '#0f3460';
            minimapCtx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                minimapCtx.beginPath();
                minimapCtx.moveTo(i * cellSize, 0);
                minimapCtx.lineTo(i * cellSize, size);
                minimapCtx.stroke();
                minimapCtx.beginPath();
                minimapCtx.moveTo(0, i * cellSize);
                minimapCtx.lineTo(size, i * cellSize);
                minimapCtx.stroke();
            }

            // 绘制模型
            const colorMap = {
                land: '#8B4513',
                house: '#FF6347',
                path: '#A0522D',
                tree: '#228B22',
                water: '#4682B4'
            };

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    if (gridObjects[x][z]) {
                        const type = gridObjects[x][z].userData.type;
                        minimapCtx.fillStyle = colorMap[type] || '#ffffff';
                        minimapCtx.fillRect(x * cellSize, z * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }
        }

        // 绑定交互事件
        function bindEvents() {
            // 鼠标点击
            renderer.domElement.addEventListener('click', onMouseClick);
            
            // 鼠标移动
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            
            // 窗口调整
            window.addEventListener('resize', onWindowResize);

            // 模型选择
            document.querySelectorAll('.model-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.model-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    currentModelType = item.dataset.type;
                    selectedObject = null;
                    document.getElementById('edit-controls').style.display = 'none';
                    document.getElementById('info-panel').style.display = 'none';
                });
            });
        }

        // 鼠标点击处理
        function onMouseClick(event) {
            event.preventDefault();
            
            // 计算鼠标位置
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / (window.innerHeight * 0.8)) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // 检测模型点击
            const modelObjects = [];
            scene.children.forEach(obj => {
                if (obj.userData.isModel) modelObjects.push(obj);
            });
            
            const intersects = raycaster.intersectObjects(modelObjects);
            
            if (intersects.length > 0) {
                // 选中已有模型
                selectObject(intersects[0].object);
                return;
            }
            
            // 检测网格点击
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const ray = raycaster.ray;
            const intersectPoint = new THREE.Vector3();
            ray.intersectPlane(plane, intersectPoint);
            
            // 计算网格坐标
            const gridX = Math.floor(intersectPoint.x + GRID_SIZE / 2);
            const gridZ = Math.floor(intersectPoint.z + GRID_SIZE / 2);
            
            if (gridX >= 0 && gridX < GRID_SIZE && gridZ >= 0 && gridZ < GRID_SIZE) {
                placeModel(gridX, gridZ);
            }
        }

        // 放置模型
        function placeModel(x, z) {
            // 移除旧模型
            if (gridObjects[x][z]) {
                scene.remove(gridObjects[x][z]);
            }
            
            let model;
            const worldX = x - GRID_SIZE / 2 + 0.5;
            const worldZ = z - GRID_SIZE / 2 + 0.5;
            
            // 根据类型创建模型
            switch(currentModelType) {
                case 'land':
                    model = createCube(1, 0.1, 1, materials.land);
                    break;
                case 'house':
                    model = createHouse();
                    break;
                case 'path':
                    model = createCube(1, 0.05, 1, materials.path);
                    break;
                case 'tree':
                    model = createTree();
                    break;
                case 'water':
                    model = createCube(1, 0.05, 1, materials.water);
                    break;
            }
            
            model.position.set(worldX, 0, worldZ);
            model.userData = {
                isModel: true,
                type: currentModelType,
                gridX: x,
                gridZ: z
            };
            
            scene.add(model);
            gridObjects[x][z] = model;
            drawMinimap();
        }

        // 创建基础立方体
        function createCube(width, height, depth, material) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            return new THREE.Mesh(geometry, material);
        }

        // 创建房子模型
        function createHouse() {
            const group = new THREE.Group();
            
            // 墙体
            const wall = createCube(0.8, 0.6, 0.8, materials.house);
            wall.position.y = 0.3;
            group.add(wall);
            
            // 屋顶
            const roofGeo = new THREE.ConeGeometry(0.6, 0.4, 4);
            const roof = new THREE.Mesh(roofGeo, new THREE.MeshLambertMaterial({ color: 0x8B0000 }));
            roof.position.y = 0.6 + 0.2;
            roof.rotation.y = Math.PI / 4;
            group.add(roof);
            
            return group;
        }

        // 创建树木模型
        function createTree() {
            const group = new THREE.Group();
            
            // 树干
            const trunk = createCube(0.15, 0.6, 0.15, new THREE.MeshLambertMaterial({ color: 0x8B4513 }));
            trunk.position.y = 0.3;
            group.add(trunk);
            
            // 树叶
            const leavesGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const leaves = new THREE.Mesh(leavesGeo, materials.tree);
            leaves.position.y = 0.6 + 0.2;
            group.add(leaves);
            
            return group;
        }

        // 选中对象
        function selectObject(object) {
            selectedObject = object;
            showInfo(object);
            document.getElementById('edit-controls').style.display = 'block';
        }

        // 显示信息面板
        function showInfo(object) {
            const panel = document.getElementById('info-panel');
            panel.style.display = 'block';
            
            document.getElementById('info-name').textContent = `${getModelName(object.userData.type)}`;
            document.getElementById('info-type').textContent = `类型：${getModelName(object.userData.type)}`;
            document.getElementById('info-pos').textContent = `网格位置：(${object.userData.gridX}, ${object.userData.gridZ})`;
            document.getElementById('info-scale').textContent = `缩放：${object.scale.x.toFixed(1)}`;
            document.getElementById('info-rotate').textContent = `旋转：${Math.round(object.rotation.y * 180 / Math.PI)}°`;
        }

        // 关闭信息面板
        function closeInfo() {
            document.getElementById('info-panel').style.display = 'none';
            document.getElementById('edit-controls').style.display = 'none';
            selectedObject = null;
        }

        // 旋转模型
        function rotateModel(angle) {
            if (!selectedObject) return;
            selectedObject.rotation.y += angle * Math.PI / 180;
            showInfo(selectedObject);
        }

        // 缩放模型
        function scaleModel(scale) {
            if (!selectedObject) return;
            selectedObject.scale.multiplyScalar(scale);
            showInfo(selectedObject);
        }

        // 获取模型名称
        function getModelName(type) {
            const names = {
                land: '土地',
                house: '房子',
                path: '小径',
                tree: '树木',
                water: '水面'
            };
            return names[type] || type;
        }

        // 鼠标移动
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / (window.innerHeight * 0.8)) * 2 + 1;
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.8);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight * 0.8);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
