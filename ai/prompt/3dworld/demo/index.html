<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D小世界编辑器</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="app.js" defer></script>
</head>
<body>
  <!-- 顶部面板 -->
  <div id="top-panel">
    <h1>3D小世界编辑器</h1>
    <div id="save-panel">
      <select id="world-select"></select>
      <button id="reset-btn">重置</button>
      <button id="clear-btn">清空</button>
    </div>
  </div>

  <!-- 工具栏 -->
  <div id="tool-bar">
    <div class="tool" data-tool="grass">🌿 草地</div>
    <div class="tool" data-tool="path">🛤 土路</div>
    <div class="tool" data-tool="water">💧 水</div>
    <div class="tool" data-tool="stone">🪨 石头</div>
    <div class="tool" data-tool="tree">🌳 树</div>
    <div class="tool" data-tool="house">🏠 房子</div>
    <div class="tool" data-tool="erase">❌ 擦除</div>
  </div>

  <!-- 小地图 -->
  <canvas id="mini-map" width="128" height="128"></canvas>

  <!-- 操作提示 -->
  <div id="hint">拖拽旋转 / 滚轮缩放 / 点击放置</div>

  <!-- Three.js 渲染器挂载点 -->
  <div id="scene-container"></div>
</body>
</html>
