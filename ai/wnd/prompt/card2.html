<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>🎂 生日贺卡叠叠乐生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background: linear-gradient(135deg, #fff5e6, #ffe4ec);
      min-height: 100vh;
      padding: 30px 20px;
    }
    /* 顶部大标题 */
    .page-title {
      text-align: center;
      font-size: 32px;
      color: #e64980;
      margin-bottom: 35px;
      letter-spacing: 2px;
      text-shadow: 1px 2px 4px rgba(255,150,180,0.4);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 40px;
      align-items: start;
    }
    /* 左侧表单 */
    .form-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(255, 107, 157, 0.25);
      border: 2px solid #ffd1dc;
      position: sticky;
      top: 30px;
    }
    .form-box h2 {
      text-align: center;
      color: #c2255c;
      margin-bottom: 25px;
      font-size: 20px;
    }
    .item {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #552042;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ffc2d1;
      border-radius: 10px;
      font-size: 15px;
      background-color: #fff9fb;
    }
    input:focus {
      outline: none;
      border-color: #ff6b9d;
      box-shadow: 0 0 6px rgba(255,107,157,0.3);
    }
    .btn-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .gen-btn {
      background: linear-gradient(90deg, #ff6b9d, #ff85a8);
      color: white;
    }
    .clear-btn {
      background: #ffb3c6;
      color: #fff;
    }
    button:hover {
      transform: translateY(-2px);
    }
    /* 右侧卡片堆叠区域 */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .birthday-card {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3 / 4;
      background: #fffdfb;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 10px 26px rgba(220, 120, 160, 0.22);
      border: 1px solid #ffd6e0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .birthday-card::before {
      content: "🎂 🎈 🎁";
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      font-size: 18px;
      opacity: 0.6;
      letter-spacing: 8px;
    }
    .card-text {
      font-size: 17px;
      line-height: 1.8;
      color: #441e34;
      padding-top: 18px;
    }
  </style>
</head>
<body>
  <h1 class="page-title">🎉 趣味生日贺卡叠叠乐 🎉</h1>

  <div class="wrap">
    <!-- 左侧输入面板 -->
    <div class="form-box">
      <h2>✨ 填写信息生成贺卡</h2>
      <div class="item">
        <label>对方姓名</label>
        <input type="text" id="name" placeholder="例如：小宇">
      </div>
      <div class="item">
        <label>年龄</label>
        <input type="text" id="age" placeholder="例如：22">
      </div>
      <div class="item">
        <label>爱好</label>
        <input type="text" id="hobby" placeholder="例如：撸猫、旅行、干饭">
      </div>
      <div class="btn-box">
        <button class="gen-btn" onclick="generateCard()">生成新贺卡</button>
        <button class="clear-btn" onclick="clearAllCards()">清空所有</button>
      </div>
    </div>

    <!-- 右侧：卡片堆叠区，新卡片在最上面 -->
    <div class="card-list" id="cardList">
    </div>
  </div>

  <script>
    const wishes = [
      `🎂 派对开启！祝${name} ${age}岁生日快乐✨<br>愿${hobby}常伴，好运爆棚，快乐满格，岁岁皆欢喜！`,
      `🎈 叮！${name} ${age}岁生辰快乐<br>尽情热爱${hobby}，暴富变美，无忧无虑，每一天都闪闪发光～`,
      `🎉 生日快乐${name}！解锁${age}岁全新版本<br>愿${hobby}治愈所有疲惫，平安喜乐，万事胜意！`,
      `🍬 恭喜${name}喜提${age}岁<br>往后三餐四季，${hobby}相伴，自由快乐，美好如约而至，不止今天！`,
      `🥳 ${name} ${age}岁生日快乐<br>愿热爱的${hobby}永不落幕，烦恼清零，快乐加倍，永远做开心小孩！`
    ];

    function generateCard() {
      const name = document.getElementById('name').value.trim();
      const age = document.getElementById('age').value.trim();
      const hobby = document.getElementById('hobby').value.trim();
      if (!name || !age || !hobby) {
        alert("请完整填写姓名、年龄、爱好！");
        return;
      }

      // 随机选一句祝福语
      const randomWish = wishes[Math.floor(Math.random() * wishes.length)]
        .replace(/\${name}/g, name)
        .replace(/\${age}/g, age)
        .replace(/\${hobby}/g, hobby);

      // 创建新卡片DOM
      const card = document.createElement('div');
      card.className = 'birthday-card';
      card.innerHTML = `<div class="card-text">${randomWish}</div>`;

      // 新卡片插到最顶部
      document.getElementById('cardList').prepend(card);
    }

    function clearAllCards() {
      document.getElementById('cardList').innerHTML = "";
    }
  </script>
</body>
</html>
