name: Sync from Gitee

on:
  push:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时自动同步一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone from Gitee and push to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git clone --mirror https://gitee.com/zhang-xuntu/xt2026-ai.git mirror
          cd mirror
          git remote set-url origin https://${GH_TOKEN}@github.com/wakg04/xt2026-ai.git
          git push --mirror
